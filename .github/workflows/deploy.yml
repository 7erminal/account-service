# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "msysmobilizer" ]
  pull_request:
    branches: [ "msysmobilizer" ]

jobs:

  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build and Deploy
      env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        cat << 'KEYEOF' > ~/.ssh/id_ed25519
        ${{ secrets.SSH_PRIVATE_KEY }}
        KEYEOF
        chmod 600 ~/.ssh/id_ed25519
        
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /usr/app/mobile-application/account-service
          git fetch origin msysmobilizer
          git checkout -f msysmobilizer
          git reset --hard origin/msysmobilizer
          go build -o account-service
          pm2 restart account-service || \
          pm2 start account-service --name account-service
        EOF